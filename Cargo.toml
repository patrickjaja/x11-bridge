[package]
name = "x11-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "X11 support bridge for Linux computer-use tooling (Claude Desktop)."

[dependencies]
cu-abort-watch = { git = "https://github.com/patrickjaja/cu-abort-watch", rev = "c8be7212b6e40e582aebc6023d69d20bbedf79dc" }
cu-atspi = { git = "https://github.com/patrickjaja/cu-atspi", rev = "a390259e9209fda8bb518a8ef253198ba3435ef0" }
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "std", "help", "suggestions"], default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.228", features = ["derive", "std"], default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
x11rb = { version = "0.13.2", default-features = false, features = ["randr", "shape", "xtest", "xfixes", "xinput"] }
xkeysym = "0.2.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
opt-level = 3
